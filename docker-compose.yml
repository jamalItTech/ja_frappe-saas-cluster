# docker-compose.yml
version: '3.8'

services:
  # شبكة مخصصة للعنقود
  network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

  # طبقة قاعدة البيانات
  db-primary:
    image: mariadb:10.6
    container_name: db-primary
    networks:
      frappe-cluster-net:
        ipv4_address: 172.20.0.10
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "frappe"
      MYSQL_INITDB_SKIP_TZINFO: "1"
    volumes:
      - db_primary_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  db-replica:
    image: mariadb:10.6
    container_name: db-replica
    networks:
      frappe-cluster-net:
        ipv4_address: 172.20.0.11
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "frappe"
    volumes:
      - db_replica_data:/var/lib/mysql
    restart: unless-stopped
    depends_on:
      - db-primary

  # طبقة الخدمات
  redis-server:
    image: redis:alpine
    container_name: redis-server
    networks:
      frappe-cluster-net:
        ipv4_address: 172.20.0.30
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass "redis123"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    networks:
      frappe-cluster-net:
        ipv4_address: 172.20.0.40
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
    restart: unless-stopped
    depends_on:
      - app-server-1
      - app-server-2
      - app-server-3

  # خوادم التطبيقات
  app-server-1:
    build:
      context: .
      dockerfile: Dockerfile.frappe-app
    container_name: app-server-1
    networks:
      frappe-cluster-net:
        ipv4_address: 172.20.0.20
    ports:
      - "8000:8000"
    environment:
      - SITE_NAME=press-admin.com
      - DB_HOST=db-primary
      - DB_PASSWORD=123456
      - REDIS_HOST=redis-server
      - REDIS_PASSWORD=redis123
    volumes:
      - app1_data:/home/frappe/production
      - ./scripts:/home/frappe/scripts
      - ./backups:/home/frappe/backups
    restart: unless-stopped
    depends_on:
      db-primary:
        condition: service_healthy
      redis-server:
        condition: service_healthy

  app-server-2:
    build:
      context: .
      dockerfile: Dockerfile.frappe-app
    container_name: app-server-2
    networks:
      frappe-cluster-net:
        ipv4_address: 172.20.0.21
    ports:
      - "8001:8000"
    environment:
      - SITE_NAME=site2.local
      - DB_HOST=db-primary
      - DB_PASSWORD=123456
      - REDIS_HOST=redis-server
      - REDIS_PASSWORD=redis123
    volumes:
      - app2_data:/home/frappe/production
      - ./scripts:/home/frappe/scripts
      - ./backups:/home/frappe/backups
    restart: unless-stopped
    depends_on:
      db-primary:
        condition: service_healthy
      redis-server:
        condition: service_healthy

  app-server-3:
    build:
      context: .
      dockerfile: Dockerfile.frappe-app
    container_name: app-server-3
    networks:
      frappe-cluster-net:
        ipv4_address: 172.20.0.22
    ports:
      - "8002:8000"
    environment:
      - SITE_NAME=site3.local
      - DB_HOST=db-primary
      - DB_PASSWORD=123456
      - REDIS_HOST=redis-server
      - REDIS_PASSWORD=redis123
    volumes:
      - app3_data:/home/frappe/production
      - ./scripts:/home/frappe/scripts
      - ./backups:/home/frappe/backups
    restart: unless-stopped
    depends_on:
      db-primary:
        condition: service_healthy
      redis-server:
        condition: service_healthy

  # خدمة المراقبة
  monitor:
    image: php:apache
    container_name: monitoring-dashboard
    networks:
      frappe-cluster-net:
        ipv4_address: 172.20.0.50
    ports:
      - "8080:80"
    volumes:
      - ./monitoring:/var/www/html
    restart: unless-stopped

networks:
  frappe-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  db_primary_data:
    driver: local
  db_replica_data:
    driver: local
  redis_data:
    driver: local
  app1_data:
    driver: local
  app2_data:
    driver: local
  app3_data:
    driver: local
