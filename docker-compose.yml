
    services:
      # 🗄️ طبقة قاعدة البيانات
      db-primary:
        image: mariadb:10.6
        container_name: db-primary
        networks:
          frappe-cluster-net:
            ipv4_address: 172.20.0.10
        environment:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: "frappe"
          MYSQL_USER: "frappe"          # ⬅️ أضف مستخدم مخصص
          MYSQL_PASSWORD: "frappe123"   # ⬅️ كلمة مرور المستخدم
        volumes:
          - db_primary_data:/var/lib/mysql
          - ./mysql/conf.d:/etc/mysql/conf.d:ro  # ⬅️ إعدادات مخصصة (اختياري)
        restart: unless-stopped
        healthcheck:                    # ⬅️ أضف health check
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
          timeout: 20s
          retries: 10
          start_period: 40s

      # 🎯 طبقة الخدمات
      redis-server:
        image: hub.ittech-ye.net/local-registery/redis:alpine
        container_name: redis-server
        networks:
          frappe-cluster-net:
            ipv4_address: 172.20.0.30
        ports:
          - "6379:6379"
        restart: unless-stopped

      # 🔷 خوادم التطبيقات
      app-server-1:
        image: frappe/erpnext:version-15
        container_name: app-server-1
        networks:
          frappe-cluster-net:
            ipv4_address: 172.20.0.20
        ports:
          - "8000:8000"
        environment:
          - MARIADB_HOST=db-primary
          - REDIS_CACHE=redis-server:6379
          - REDIS_QUEUE=redis-server:6379
          - SOCKETIO=redis-server:6379
          - SITE_NAME=erpnext.local
        # volumes تم تعديلها لتجنب إنشاء frappe-bench تلقائيًا
        volumes:
          # قم بربط فقط مجلدات فرعية محددة تريد التحكم بها
          - /workspaces/frappe/sites:/home/frappe/sites
          # يمكنك إضافة مجلدات أخرى حسب حاجتك، لكن لا تربط /home/frappe بالكامل
        depends_on:
          - db-primary
          - redis-server
        user: root
        tty: true
        command: tail -f /dev/null

      # 🌐 بروكسي سيرفر (Load Balancer)
      proxy-server:
        image: hub.ittech-ye.net/local-registery/nginx:latest
        container_name: proxy-server
        networks:
          frappe-cluster-net:
            ipv4_address: 172.20.0.40
        ports:
          - "80:80"
          - "443:443"
        volumes:
          - ./nginx/nginx.conf:/etc/nginx/nginx.conf
          - ./nginx/conf.d:/etc/nginx/conf.d
        restart: unless-stopped
        depends_on:
          - app-server-1

      # 📊 خادم المراقبة
      monitor-server:
        image: hub.ittech-ye.net/local-registery/prom/prometheus:latest
        container_name: monitor-server
        networks:
          frappe-cluster-net:
            ipv4_address: 172.20.0.50
        ports:
          - "9090:9090"
        volumes:
          - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
          - prometheus_data:/prometheus
        restart: unless-stopped
        command:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--storage.tsdb.retention.time=200h'
          - '--web.enable-lifecycle'

      # 📈 واجهة المراقبة (Grafana)
      grafana:
        image: hub.ittech-ye.net/local-registery/grafana/grafana:latest
        container_name: grafana-server
        networks:
          frappe-cluster-net:
            ipv4_address: 172.20.0.51
        ports:
          - "3000:3000"
        environment:
          - GF_SECURITY_ADMIN_PASSWORD=admin123
        volumes:
          - grafana_data:/var/lib/grafana
          - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
          - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
        restart: unless-stopped
        depends_on:
          - monitor-server

      # 📝 خادم السجلات
      log-server:
        image: hub.ittech-ye.net/local-registery/elasticsearch:8.11.0
        container_name: log-server
        networks:
          frappe-cluster-net:
            ipv4_address: 172.20.0.60
        environment:
          - discovery.type=single-node
          - xpack.security.enabled=false
          - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        ports:
          - "9200:9200"
        volumes:
          - elasticsearch_data:/usr/share/elasticsearch/data
        restart: unless-stopped

      # 🔍 واجهة السجلات (Kibana)
      kibana:
        image: hub.ittech-ye.net/local-registery/kibana:8.11.0
        container_name: kibana-server
        networks:
          frappe-cluster-net:
            ipv4_address: 172.20.0.61
        environment:
          - ELASTICSEARCH_HOSTS=http://log-server:9200
        ports:
          - "5601:5601"
        restart: unless-stopped
        depends_on:
          - log-server

    networks:
      frappe-cluster-net:
        driver: bridge
        ipam:
          config:
            - subnet: 172.20.0.0/16

    volumes:
      db_primary_data:
      app1_data:
      prometheus_data:
      grafana_data:
      elasticsearch_data: