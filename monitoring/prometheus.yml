global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'frappe-servers'
    static_configs:
      - targets: ['app-server-1:8000', 'app-server-2:8000']
  
  - job_name: 'database'
    static_configs:
      - targets: ['db-primary:3306']
  
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-server:6379']